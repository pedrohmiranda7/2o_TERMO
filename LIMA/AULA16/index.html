<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrossel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
</head>
<body>
    
    <h1 class="bg-success m-4 p-4 text-white">Personagens</h1>
    <section id="Carousel-Personagens" class="carousel slide m-4 p-4" style="width: 100%; height: 50%;" data-bs-ride="carousel">
        <article class="carousel-inner">
            <aside class="carousel-item active" data-bs-interval="500">
                <img src="https://d1q3zw97enxzq2.cloudfront.net/images/What_is_4K.width-1000.format-webp.webp" class="d-block w-100 h-100" alt="Tecnologia">
            </aside>

            <aside class="carousel-item" data-bs-interval="500">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRnr3V59G08ACwdZrieXNsvI43etTgCEEMY2naVWZAckExeKwL5ek8xQVs0&s=10" class="d-block w-100 h-100" alt="Astronauta">
            </aside>

            <aside class="carousel-item" data-bs-interval="500">
                <img src="https://wallpapers.com/images/hd/4k-space-pictures-gjfaafj06sm512c6.jpg" class="d-block w-100 h-100" alt="Galáxia">
            </aside>
        </article>
    </section>

    <h2>Badges</h2>
    <p>
        Woody <span class="badge text-bg-success">Xerife</span>
    </p>

    <h2>Buzz</h2>
    <p>
        Buzz <span class="badge text-bg-warning">Patrulheiro Espacial</span>
    </p>

    <h2>Sr. Cabeça de Batata</h2>
    <p>
        Cabeça de Batata <span class="badge text-bg-danger">Batata</span>
    </p>

    <h1>Alertas</h1>
    <section class="alert alert-warning" role="alert">
        Woody - Xerife Local do Pizza Planet
    </section>

    <section class="alert alert-danger" role="alertdialog">
        Buzz - Patrulheiro Espacial - Planeta de BuzzPlanet
    </section>

    <section class="alert alert-success" role="alert">
        Sr Cabeça de Batata - Parceiro do Woody
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>


</body>
</html>
